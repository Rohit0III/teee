    <div data-include="footer.html"></div>
    <script>
        // Simple script to ensure images load properly
        document.addEventListener('DOMContentLoaded', function() {
            const images = document.querySelectorAll('img');
            
            images.forEach(img => {
                img.addEventListener('error', function() {
                    this.src = '/placeholder.svg?height=250&width=300';
                });
            });

            // Log container width for verification
            const container = document.querySelector('.gallery-container');
            console.log('Container width:', container.offsetWidth + 'px');
        });
    </script>
    
    <script src="load-layout.js"></script>
