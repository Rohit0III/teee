<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Upload Form with Decorative Border</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <style>


    .form-container {
      max-width: 800px;
      margin: 0 auto;
      background-color: #e8e0d6;
      position: relative;
      border-radius: 10px;
      overflow: hidden;
    }

    /* Decorative Border */
    .border-decoration {
      position: absolute;
      background-image: url('/images/v-border2.png');
      background-repeat: repeat;
      background-size: contain;
      z-index: 1;
    }

    .border-top {
      top: 0;
      left: 0;
      right: 0;
      height: 20px;
      background-position: top;
    }

    .border-bottom {
      bottom: 0;
      left: 0;
      right: 0;
      height: 20px;
      background-position: bottom;
    }

    .border-left {
      top: 0;
      left: 0;
      bottom: 0;
      width: 20px;
      background-position: left;
    }

    .border-right {
      top: 0;
      right: 0;
      bottom: 0;
      width: 20px;
      background-position: right;
    }

    /* Form Content */
    .form-content {
      padding: 60px;
      margin: 0 20px;
      position: relative;
      z-index: 2;
    }

    .form-title {
      color: #8b4513;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-row {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }

    .form-row .form-group {
      flex: 1;
      margin-bottom: 0;
    }

    label {
      display: block;
      color: #8b4513;
      font-weight: bold;
      margin-bottom: 5px;
      font-size: 14px;
    }

    input[type="text"],
    input[type="email"],
    input[type="date"],
    select,
    .file-input-wrapper {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background-color: white;
      font-size: 14px;
    }

    select {
      background-color: white;
      cursor: pointer;
    }

    .file-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      cursor: pointer;
      background-color: #f8f8f8;
    }

    .file-input {
      position: absolute;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    .file-input-text {
      flex: 1;
      padding: 0 10px;
      color: #666;
    }

    .file-input-button {
      background-color: #ddd;
      border: 1px solid #ccc;
      padding: 8px 15px;
      border-radius: 3px;
      font-size: 12px;
      margin-right: 10px;
    }

    .button-group {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-top: 30px;
    }

    .btn {
      padding: 12px 30px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .btn-submit {
      background-color: liner-gradient(to right, #7B3F00, #FFB66A);
      color: white;
    }

    .btn-submit:hover {
      background-color: #6d3410;
    }

    .btn-reset {
      
      background-color: #F9FAFB;
      
      
    }

    .btn-reset:hover {
     background-color: #F9FAFB;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .form-row {
        flex-direction: column;
        gap: 0;
      }

      .form-content {
        padding: 40px 30px;
        margin: 0 10px;
      }

      .button-group {
        flex-direction: column;
        align-items: center;
      }

      .btn {
        width: 200px;
      }
    }

    /* File upload preview */
    .file-preview {
      margin-top: 10px;
      padding: 10px;
      background-color: #f0f0f0;
      border-radius: 4px;
      display: none;
    }

    .file-preview img {
      max-width: 200px;
      max-height: 200px;
      border-radius: 4px;
    }

   
  </style>
</head>
<body>

    <div >
 <header data-include="header.html" class="header-issue"  ></header>
 </div>

     <div class="mandala-container">
            <div class="mandala-left"></div>
            <h1 class="ashramshala-title yatra-one-regular">कार्यालयीन फॉर्म</h1>
            <div class="mandala-right"></div>
        </div>
  <div class="form-container">
    <!-- Decorative Borders -->
    <div class="border-decoration border-top"></div>
    <div class="border-decoration border-bottom"></div>
    <div class="border-decoration border-left"></div>
    <div class="border-decoration border-right"></div>

    <div class="form-content">
      <form id="uploadForm">
        <!-- File Upload Section -->
        <div class="form-group">
          <label>छवि फ़ाइल अपलोड</label>
          <div class="file-input-wrapper">
            <button type="button" class="file-input-button">Choose File</button>
            <span class="file-input-text" id="fileInputText">No file chosen</span>
            <input type="file" class="file-input" id="fileInput" accept="image/*">
          </div>
          <div class="file-preview" id="filePreview"></div>
        </div>

        <!-- Category Selection -->
        <div class="form-group">
          <label>स्थित श्रेणी मुख्य श्रेणी (Category)</label>
          <select id="category" required>
            <option value="">-- निवडा --</option>
            <option value="category1">श्रेणी 1</option>
            <option value="category2">श्रेणी 2</option>
            <option value="category3">श्रेणी 3</option>
            <option value="category4">श्रेणी 4</option>
          </select>
        </div>

        <!-- Name and Group Fields -->
        <div class="form-row">
          <div class="form-group">
            <label>नाम</label>
            <input type="text" id="name" required>
          </div>
          <div class="form-group">
            <label>तहसीली गुप</label>
            <input type="text" id="group" required>
          </div>
        </div>

        <!-- Officer Name and Code -->
        <div class="form-row">
          <div class="form-group">
            <label>अधिकारी/कर्मचारी नाम</label>
            <input type="text" id="officerName" required>
          </div>
          <div class="form-group">
            <label>अधिकारी/कर्मचारी Code</label>
            <input type="text" id="officerCode" required>
          </div>
        </div>

        <!-- Birth Number and Joining Date -->
        <div class="form-row">
          <div class="form-group">
            <label>जन्म क्रमांक</label>
            <input type="text" id="birthNumber" required>
          </div>
          <div class="form-group">
            <label>पदालयात रुजू झाल्याचा दिनांक</label>
            <input type="date" id="joiningDate" required>
          </div>
        </div>

        <!-- Email and Position -->
        <div class="form-row">
          <div class="form-group">
            <label>Email ID</label>
            <input type="email" id="email" required>
          </div>
          <div class="form-group">
            <label>अधिकारी/कर्मचारी पद</label>
            <input type="text" id="position" required>
          </div>
        </div>

        <!-- Birth Date and Retirement Date -->
        <div class="form-row">
          <div class="form-group">
            <label>जन्म दिनांक</label>
            <input type="date" id="birthDate" required>
          </div>
          <div class="form-group">
            <label>सेवानिवृत्त दिनांक</label>
            <input type="date" id="retirementDate" required>
          </div>
        </div>

        <!-- Submit and Reset Buttons -->
        <div class="button-group">
          <button type="submit" class="btn btn-submit">Submit</button>
          <button type="reset" class="btn btn-reset">Reset</button>
        </div>
      </form>
    </div>
  </div>


<footer data-include="footer.html"></footer>
  <script src="/load-layout.js"></script>
  <script>
    const fileInput = document.getElementById('fileInput');
    const fileInputText = document.getElementById('fileInputText');
    const filePreview = document.getElementById('filePreview');
    const fileInputWrapper = document.querySelector('.file-input-wrapper');

    fileInputWrapper.addEventListener('click', function () {
      fileInput.click();
    });

    fileInput.addEventListener('change', function (e) {
      const file = e.target.files[0];

      if (file) {
        fileInputText.textContent = file.name;

        if (file.type.startsWith('image/')) {
          const reader = new FileReader();
          reader.onload = function (e) {
            filePreview.innerHTML = `
              <p><strong>Preview:</strong></p>
              <img src="${e.target.result}" alt="Preview">
              <p><strong>File:</strong> ${file.name}</p>
              <p><strong>Size:</strong> ${(file.size / 1024).toFixed(2)} KB</p>
            `;
            filePreview.style.display = 'block';
          };
          reader.readAsDataURL(file);
        } else {
          filePreview.innerHTML = `
            <p><strong>File:</strong> ${file.name}</p>
            <p><strong>Size:</strong> ${(file.size / 1024).toFixed(2)} KB</p>
            <p><strong>Type:</strong> ${file.type}</p>
          `;
          filePreview.style.display = 'block';
        }
      } else {
        fileInputText.textContent = 'No file chosen';
        filePreview.style.display = 'none';
      }
    });

    document.getElementById('uploadForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const formData = new FormData();
      const file = fileInput.files[0];

      if (!file) {
        alert('कृपया एक फ़ाइल चुनें।');
        return;
      }

      formData.append('file', file);

      const fields = [
        'category', 'name', 'group', 'officerName', 'officerCode',
        'birthNumber', 'joiningDate', 'email', 'position',
        'birthDate', 'retirementDate'
      ];

      fields.forEach(field => {
        formData.append(field, document.getElementById(field).value);
      });

      console.log('Form submitted with data:');
      for (let [key, value] of formData.entries()) {
        console.log(key, value);
      }

      alert('फॉर्म सफलतापूर्वक सबमिट किया गया!');
    });

    document.querySelector('.btn-reset').addEventListener('click', function () {
      fileInputText.textContent = 'No file chosen';
      filePreview.style.display = 'none';
    });
  </script>
</body>
</html>
